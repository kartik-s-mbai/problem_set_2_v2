<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HDB Resale Budget Checker</title>
    <meta name="description" content="Check the latest median resale price and transaction volume for HDB flats from data.gov.sg to help first-time buyers plan their housing budget." />
    <meta property="og:title" content="HDB Resale Budget Checker" />
    <meta property="og:description" content="Check the latest median resale price and transaction volume for HDB flats from data.gov.sg to help first-time buyers plan their housing budget." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      window.addEventListener(
        'error',
        function (event) {
          if (
            event.message === 'Script error.' ||
            (event.filename && event.filename.indexOf('disqus') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        },
        true
      );
      window.onerror = function (msg, url) {
        if (msg === 'Script error.' || (url && url.indexOf('disqus') !== -1)) {
          return true;
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
