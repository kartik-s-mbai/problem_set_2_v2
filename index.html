    <script>
      // Suppress cross-origin Script errors from third-party scripts (e.g. Disqus widgets/trackers in preview iframes)
      window.addEventListener('error', function (event) {
        if (
          event.message === 'Script error.' ||
          (event.filename && (event.filename.includes('disqus') || event.filename.includes('disquscdn')))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (String(event.reason).includes('disqus') || String(event.reason).includes('Script error'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.onerror = function (msg, url) {
        if (
          msg === 'Script error.' ||
          (typeof msg === 'string' && msg.includes('Script error')) ||
          (url && (url.includes('disqus') || url.includes('disquscdn')))
        ) {
          return true;
        }
      };
    </script>
