    <script>
      (function () {
        function isScriptError(event) {
          if (!event) return false;
          var msg = String(event.message || (event.error && event.error.message) || '');
          return msg === 'Script error.' || msg.indexOf('Script error') !== -1;
        }
        window.addEventListener('error', function (e) {
          if (isScriptError(e)) {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var reason = String((e && e.reason && (e.reason.message || e.reason)) || '');
          if (reason.indexOf('Script error') !== -1) {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          }
        }, true);
        window.onerror = function (msg) {
          if (typeof msg === 'string' && msg.indexOf('Script error') !== -1) {
            return true;
          }
        };
      })();
    </script>
