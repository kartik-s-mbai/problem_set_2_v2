    <script>
      // Suppress cross-origin third-party script errors (e.g. Disqus / tracking in preview iframes)
      (function () {
        function shouldSuppress(msg, url, filename) {
          var m = String(msg || '');
          var u = String(url || filename || '');
          return (
            m === 'Script error.' ||
            m.indexOf('Script error') !== -1 ||
            u.indexOf('disqus') !== -1 ||
            u.indexOf('disquscdn') !== -1 ||
            u.indexOf('clarity') !== -1 ||
            (!u && (!m || m === 'Script error.'))
          );
        }

        function errorHandler(event) {
          if (!event) return;
          var msg = event.message || (event.error && event.error.message) || '';
          var file = event.filename || '';
          if (shouldSuppress(msg, file, file)) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }

        window.addEventListener('error', errorHandler, true);
        window.addEventListener('error', errorHandler, false);

        window.addEventListener('unhandledrejection', function (event) {
          if (!event) return;
          var reason = String(event.reason || (event.reason && event.reason.message) || '');
          if (
            reason.indexOf('disqus') !== -1 ||
            reason.indexOf('disquscdn') !== -1 ||
            reason.indexOf('clarity') !== -1 ||
            reason.indexOf('Script error') !== -1
          ) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function (msg, url, lineNo, colNo, error) {
          if (shouldSuppress(msg, url, '')) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };
      })();
    </script>
